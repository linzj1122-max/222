<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ozon 排名采集器</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <strong>Ozon 排名采集器</strong>
      <span>MPStats 页面数据 → 控制中心</span>
    </header>

    <section>
      <label>控制中心地址<input id="dashboardUrl" placeholder="https://xxx.pages.dev" /></label>
      <label>连接 Token<textarea id="token" rows="3" placeholder="在控制中心生成"></textarea></label>
      <div class="row">
        <button id="pasteConfig" class="secondary" type="button">粘贴配置</button>
        <button id="saveConfig" class="secondary" type="button">保存配置</button>
      </div>
    </section>

    <section>
      <label>Ozon 关键词<input id="keyword" placeholder="сыворотка для глаз" /></label>
      <label>我的 Product ID<input id="productId" placeholder="可选" /></label>
      <button id="openSearch" type="button">打开全站搜索</button>
      <button id="collect" type="button">采集并发送到控制中心</button>
    </section>

    <div id="status" role="status">先从控制中心复制连接配置。</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
